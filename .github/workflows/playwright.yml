name: Playwright Tests

on:
  push:              # every push to every branch
  pull_request:      # every pull request
  workflow_dispatch: # manual runs, used for the before/after timing
    inputs:
      shards:
        description: 'Number of shards (1 = "before", no sharding; 4 = "after")'
        type: choice
        options: ['4', '1']
        default: '4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    # The Toolshop sits behind Cloudflare, which answers GitHub-hosted runners
    # (datacenter IPs) with a 403 bot check instead of the app. The tests therefore
    # run on self-hosted runners on the student's own machine; see
    # ci/setup-self-hosted-runners.ps1. Four runners there = four parallel shards.
    runs-on: [self-hosted, toolshop]
    # A self-hosted runner on a public repository must never run code from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # push / pull_request have no inputs, so they always get 4 shards.
        shardIndex: ${{ fromJSON(inputs.shards == '1' && '[1]' || '[1, 2, 3, 4]') }}
        shardTotal: ${{ fromJSON(inputs.shards == '1' && '[1]' || '[4]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm                 # caches ~/.npm, keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          # Optional repository variable; falls back to the production Toolshop.
          BASE_URL: ${{ vars.BASE_URL || 'https://practicesoftwaretesting.com' }}
          API_URL: ${{ vars.API_URL || 'https://api.practicesoftwaretesting.com' }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1          # intermediate file, only needed by merge-reports

      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            test-results/
            reports/
          retention-days: 14

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    # Merging needs no access to the site, so it runs on a GitHub-hosted runner.
    # Pinned: ubuntu-latest is now Ubuntu 26, which Playwright 1.55 does not support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML + JUnit
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload merged JUnit
        uses: actions/upload-artifact@v5
        with:
          name: junit-report
          path: reports/junit-merged.xml
          retention-days: 14
